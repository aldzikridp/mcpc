[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hax-mcp-bridge"
version = "0.1.0"
description = "mcpc: a minimal Model Context Protocol client for hax"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "agent", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# Standard library only: adding a dependency here defeats the point of the bridge.
dependencies = []

[project.scripts]
mcpc = "mcp_bridge:cli"

[tool.setuptools]
# py-modules, not packages: the bridge is one file installed as a console script.
package-dir = { "" = "scripts" }
py-modules = ["mcp_bridge"]

[tool.setuptools.package-data]
"*" = ["mcp.json"]
